name: 🚀 BrandPulse AI — CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Frontend Build & Type Check
  # ─────────────────────────────────────────────
  frontend-build:
    name: 🎨 Frontend — Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: 🔨 Build production bundle
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: ✅ Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 2: Backend Lint & Syntax Check
  # ─────────────────────────────────────────────
  backend-check:
    name: ⚙️ Backend — Lint & Syntax Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔍 Syntax check entry point
        run: node --check src/index.js

      - name: 🔍 Syntax check app
        run: node --check src/app.js

  # ─────────────────────────────────────────────
  # Job 3: Deployment Status Notification
  # ─────────────────────────────────────────────
  deploy-status:
    name: 📡 Deployment Status
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 🎉 CI passed — Vercel & Render will auto-deploy
        run: |
          echo "✅ Frontend build: PASSED"
          echo "✅ Backend check: PASSED"
          echo ""
          echo "📦 Vercel auto-deploy: https://vercel.com/shahzad-khan-11/brandpulse-ai"
          echo "🖥️  Render auto-deploy: https://dashboard.render.com"
          echo ""
          echo "🚀 BrandPulse AI is being deployed automatically!"
