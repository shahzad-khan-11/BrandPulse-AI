version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: brandpulse-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping: 1})"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brandpulse-network

  backend:
    build: ./backend
    container_name: brandpulse-backend
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/brandpulse
      - JWT_SECRET=bf3e2dbf77c8e9b8849b29d472bfbe488ea9b88dc369c0d51fa30a08e79b8f2a
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - brandpulse-network

  frontend:
    build: ./frontend
    container_name: brandpulse-frontend
    ports:
      - '5173:80' # Maps localhost Port 5173 to Nginx Port 80 in container
    depends_on:
      - backend
    networks:
      - brandpulse-network

volumes:
  mongo-data:

networks:
  brandpulse-network:
    driver: bridge
